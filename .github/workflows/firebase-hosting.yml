# Har safar main tarmog'iga o'zgarish yuklanganda sayt psixolab.web.app manziliga avtomatik joylanadi.
# Kerakli secret: FIREBASE_SERVICE_ACCOUNT_PSIXOLAB (Firebase → Project settings → Service accounts → Generate new private key)
name: Firebase Hosting'ga joylash
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PSIXOLAB }}
          projectId: psixolab
          channelId: live
